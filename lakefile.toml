name = "aci_bootstrap"
version = "0.1.0"
defaultTargets = ["AciLib"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0-rc2"

[[lean_lib]]
name = "AciLib"
globs = ["ACIManifold", "AM10", "AWM21", "AWMCore", "AntaresCategory", "MC2Engine", "Manifold21", "Matrix7", "MoruzinLaw", "MyProject", "N7Spine", "Optimus7", "Optimus7Quantum", "PhysicsCore", "QuantumCore", "SovereignHamiltonian", "SpineLanguage"]

[[lean_exe]]
name = "aci_bootstrap"
root = "Main"
