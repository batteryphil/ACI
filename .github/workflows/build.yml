name: Build ACI Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # This allows you to trigger it manually from the UI!

jobs:
  build-individual:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # CRITICAL: This keeps other builds running if one fails
      matrix:
        target: [ "Optimus7Quantum", "SovereignHamiltonian" ] # Add your files here
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build Module
        run: |
          lake exe cache get || echo "Cache fetch failed, continuing..."
          lake build ${{ matrix.target }}
