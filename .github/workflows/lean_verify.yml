name: Lean Action CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify ACI Sovereign Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json') }}

      - name: Build All Proofs
        run: ~/.elan/bin/lake build

      - name: Seal Confirmation
        run: echo "ACI SOVEREIGN PROOFS VERIFIED AND SEALED"
