name: ACI Lean Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify ACI Sovereign Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean4 via Elan
        uses: leanprover/lean4-action@v1

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json') }}

      - name: Build and Verify All Proofs
        run: lake build

      - name: Seal Confirmation
        run: echo "ACI SOVEREIGN PROOFS VERIFIED AND SEALED"
